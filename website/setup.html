<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Underseerr</title>
    <script>
        // Try to open the app
        const params = new URLSearchParams(window.location.search);
        const server = params.get('server');
        const deepLink = `underseerr://setup${server ? '?server=' + encodeURIComponent(server) : ''}`;
        
        // Attempt to open the app
        window.location.href = deepLink;
        
        // Fallback to Play Store after 2 seconds if app doesn't open
        setTimeout(() => {
            window.location.href = 'https://play.google.com/store/apps/details?id=app.lusk.underseerr';
        }, 2000);
    </script>
</head>
<body>
    <p>Opening Underseerr...</p>
    <p>If the app doesn't open, you'll be redirected to the Play Store.</p>
</body>
</html>
