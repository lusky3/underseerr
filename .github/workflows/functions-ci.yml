name: Functions CI

on:
  push:
    branches: [ "main", "develop", "release/*" ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-ci.yml'
  pull_request:
    branches: [ "main", "develop", "release/*" ]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-ci.yml'

permissions:
  contents: read

jobs:
  check:
    name: Functions - Lint, Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./functions
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads engines.node, the same field Firebase deploys from, so CI always
      # tests the runtime that would actually be deployed.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: functions/package.json
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # npm ci fails on an unresolvable lockfile, which is how a broken
      # dependency bump would otherwise look green.
      - name: Install dependencies
        run: npm ci

      # `npm run lint` passes --fix (it is also the deploy predeploy hook);
      # CI must report problems, not rewrite them away.
      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=critical
